<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Claude Code 手机端</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="header">
    <div id="status-dot" class="status-dot"></div>
    <button id="header-info">
      <div id="header-title">Claude Code</div>
      <div id="header-cwd">连接中…</div>
    </button>
    <button id="usage-btn" class="icon-btn" title="用量">◔</button>
    <div id="header-controls">
      <select id="model-select" title="模型">
        <option value="default">默认模型</option>
      </select>
      <select id="mode-select" title="权限模式">
        <option value="default">默认（逐项确认）</option>
        <option value="acceptEdits">自动接受编辑</option>
        <option value="plan">仅规划</option>
        <option value="auto">自动模式（AI 审批，需账号支持）</option>
      </select>
    </div>
  </header>

  <main id="chat"></main>

  <div id="sessions-overlay" hidden>
    <div id="sessions-panel">
      <div id="sessions-panel-header">
        <div id="sessions-panel-title">会话</div>
        <button id="sessions-close-btn" class="icon-btn">×</button>
      </div>
      <div id="new-session-form">
        <input id="new-session-cwd" type="text" placeholder="项目路径（留空用默认目录）" />
        <button id="new-session-btn" class="icon-btn primary" title="新建会话">＋</button>
      </div>
      <div id="sessions-list"></div>
    </div>
  </div>

  <div id="usage-overlay" hidden>
    <div id="usage-panel">
      <div id="usage-panel-header">
        <div id="usage-panel-title">用量</div>
        <button id="usage-close-btn" class="icon-btn">×</button>
      </div>
      <div id="usage-body">
        <div class="usage-loading">加载中…</div>
      </div>
    </div>
  </div>

  <footer id="composer">
    <textarea id="input" rows="1" placeholder="给 Claude Code 发消息…" enterkeyhint="send"></textarea>
    <button id="send-btn" class="icon-btn primary" title="发送">↑</button>
  </footer>

  <script src="vendor/marked/marked.umd.js"></script>
  <script src="vendor/dompurify/purify.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
